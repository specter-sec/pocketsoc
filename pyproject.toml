[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pocketsoc-termux"
version = "0.1.0"
description = "A lightweight defensive SOC lab for Android Termux and Linux"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "IFTIKHAR"}]
dependencies = ["PyYAML>=6.0,<7", "python-dotenv>=1.0,<2", "asyncssh>=2.20,<3"]
classifiers = ["Programming Language :: Python :: 3", "Operating System :: POSIX"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1", "build>=1,<2"]

[project.scripts]
pocketsoc = "pocketsoc.cli:main"

[tool.setuptools.packages.find]
include = ["pocketsoc*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
